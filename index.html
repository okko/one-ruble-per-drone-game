<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + dynamic viewport units handle the iOS Safari URL bar and notch
         (docs/compatibility.md §3). user-scalable=no suppresses double-tap zoom on the canvas. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>One Ruble Per Drone</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh; /* fallback */
        height: 100dvh; /* dynamic viewport — survives iOS URL-bar show/hide */
        background: #000;
        overflow: hidden;
        /* Gesture hygiene: suppress scroll, text selection, and the long-press callout. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      /* The three.js world at the device's native resolution (§request: iPhone 17 = 2622×1206).
         It is the backdrop for every scene, not just Playing, so it is always visible and sits
         at the bottom of the stack with the DOM layers composited over it. */
      #game3d {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* DOM HUD + resident-interaction overlay over the 3D world (crisp text at native resolution). */
      #hud {
        position: fixed;
        inset: 0;
        display: none;
        z-index: 2;
        pointer-events: none;
      }
      /* The DOM UI layer: every screen and overlay is mounted here, composited over the live
         3D scene. Click-through by default — only interactive elements opt back in, or aiming
         breaks (docs/areas/10-hud-ui.md §3.1). Full styling lives in src/ui/styles/. */
      #ui {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      /* The rotate prompt is CSS-only. Orientation lock is unavailable on iOS Safari — we
         prompt, we cannot force (docs/compatibility.md §3) — and a media query does this
         without a resize listener or a frame of the wrong layout. */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #1a1c2c;
        color: #fff6e6;
        font-family: system-ui, sans-serif;
        font-size: 1.25rem;
        text-align: center;
        padding: 2rem;
        z-index: 10;
      }
      @media (orientation: portrait) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game3d"></canvas>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="rotate-overlay" aria-hidden="true">Please rotate your device to landscape ☺</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
